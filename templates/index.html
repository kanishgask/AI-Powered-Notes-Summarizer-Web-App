<!DOCTYPE html>
<html>
<head>
    <title>AI Notes Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>AI Notes Summarizer</h1>

    <form action="/summarize" method="post">
        <textarea name="text" placeholder="Paste your notes here..." required></textarea>
        <br>
        <button type="submit">Summarize</button>
    </form>

    {% if summary %}
        <div class="result">
            <h2>Summary:</h2>
            <p>{{ summary }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
